<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172019">
<link rel="manifest" href="manifest.webmanifest">
<title>Family Wealth Planner 1.2</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="toast"></div>

<section id="onboarding" class="overlay" style="display: none;">
  <div class="onboard shell">
    <div class="brand">
      <div class="logo"><img src="icon.svg" alt="FW"></div>
      <b>Family Wealth Planner</b>
    </div>
    <div id="onStep"></div>
  </div>
</section>

<header>
  <div class="shell bar">
    <div class="brand">
      <div class="logo"><img src="icon.svg" alt="FW"></div>
      <div class="brand-text">
        <b>Family Wealth Planner</b>
        <small>Fondasi Milestone 1.2</small>
      </div>
    </div>
    <div class="bar-actions">
      <button class="icon" data-action="privacy" aria-label="Toggle privacy">👁</button>
      <button class="icon" data-action="theme" aria-label="Toggle theme">◐</button>
    </div>
  </div>
</header>

<main class="shell"><section id="view"></section></main>

<nav id="nav">
  <!-- Ikon Beranda: Rumah -->
  <button data-page="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
    <span>Beranda</span>
  </button>
  
  <!-- Ikon Rencana: Kalender dengan Centang -->
  <button data-page="plan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
      <line x1="16" y1="2" x2="16" y2="6"></line>
      <line x1="8" y1="2" x2="8" y2="6"></line>
      <line x1="3" y1="10" x2="21" y2="10"></line>
      <path d="M9 15l2 2 4-4"></path>
    </svg>
    <span>Rencana</span>
  </button>
  
  <button class="add" data-action="quickAdd" aria-label="Tambah cepat">＋</button>
  
  <!-- Ikon Kekayaan: Dompet -->
  <button data-page="wealth">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="5" width="20" height="14" rx="2"></rect>
      <path d="M2 10h20"></path>
      <circle cx="16" cy="15" r="1" fill="currentColor"></circle>
    </svg>
    <span>Kekayaan</span>
  </button>
  
  <!-- Ikon Lainnya: Titik Tiga -->
  <button data-page="more">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="1" fill="currentColor"></circle>
      <circle cx="19" cy="12" r="1" fill="currentColor"></circle>
      <circle cx="5" cy="12" r="1" fill="currentColor"></circle>
    </svg>
    <span>Lainnya</span>
  </button>
</nav>

<dialog id="modal">
  <div class="modal-head">
    <b id="modalTitle"></b>
    <button class="icon" data-action="closeModal" aria-label="Tutup">×</button>
  </div>
  <form id="modalForm">
    <div id="modalBody" class="modal-body"></div>
    <div id="modalFoot" class="modal-foot"></div>
  </form>
</dialog>

<input id="restoreFile" style="display: none;" type="file" accept="application/json">

<script src="db.js"></script>
<script src="gold-market.js"></script>
<script src="app.js"></script>
</body>
</html>
